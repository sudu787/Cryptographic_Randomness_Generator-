[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "entropylens"
dynamic = ["version"]
description = "Auditable cryptographic randomness generation and entropy-source health research platform (research prototype)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "EntropyLens authors" }]
keywords = ["randomness", "csprng", "entropy", "health tests", "SP 800-90B", "fault injection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
]
# Ranges are the supported envelope; requirements.txt pins the exact verified environment.
# `cryptography` has no upper bound so that security releases are never blocked.
dependencies = [
    "numpy>=2.1,<3",
    "scipy>=1.14.1,<2",
    "cryptography>=43",
    "pydantic>=2.9,<3",
    "jinja2>=3.1.4,<4",
    "plotly>=5.24,<7",
    "psutil>=6.0,<8",
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.40,<2",
    "pandas>=2.2.3,<4",
]
dev = [
    "pytest>=8.3,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.7",
    "mypy>=1.13,<3",
]

[tool.setuptools.dynamic]
version = { attr = "entropylens.__version__" }

[tool.setuptools.packages.find]
include = ["entropylens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: long-running statistical calibration tests (deselect with -m 'not slow')",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# S = flake8-bandit security checks (e.g. S311 flags the non-cryptographic `random` module).
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # pytest uses bare asserts

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["entropylens"]

# These libraries ship no type information. Numeric results are converted with float()/int() at
# use; pandas and Plotly are used only for display in the dashboard.
[[tool.mypy.overrides]]
module = ["scipy", "scipy.*", "psutil", "pandas", "pandas.*", "plotly", "plotly.*"]
ignore_missing_imports = true
